<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ulu Reklam | Tabela Modelleri</title>
    <script>
      (function() {
        const width = window.innerWidth;
        if (width >= 1024) {
          window.location.replace("index-desktop.html");
        } else if (width >= 768) {
          window.location.replace("index-tablet.html");
        } else {
          window.location.replace("index-mobile.html");
        }
      })();
    </script>
  </head>

</html>
